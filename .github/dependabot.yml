version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 3 * * 4"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - Schimi1983
    versioning-strategy: increase
    ignore:
      # @types/node must match the minimum supported Node.js version
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (used by @iobroker/eslint-config) supports TypeScript < 6.1 only.
      # Update TypeScript manually once the ioBroker ESLint config supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "43 3 * * 4"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - Schimi1983
